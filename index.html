 */const j4=Re("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),f7=[{id:1,name:"北海道",kana:"ほっかいどう",capital:"札幌市",capitalKana:"さっぽろ",region:"北海道",oldProvinces:["蝦夷地"],lat:43.06,lng:141.35,nameMatchesCapital:!1,capitalStory:"函館でも小樽でもなく、当時ほぼ未開だった石狩平野に開拓使が「新首都」を設計した。手本は京都の条坊制で、いまの碁盤の目の街並みはその名残。地名はアイヌ語「サッ・ポロ・ペッ（乾いた・大きな・川）」に由来する。",trivia:"面積は日本の約22%。県の下に「振興局」があるのは廃藩置県ではなく、開拓使→三県一局という独自の統治史を経たため。",specialty:"じゃがいも・乳製品・海産物"},{id:2,name:"青森県",kana:"あおもり",capital:"青森市",capitalKana:"あおもり",region:"東北",oldProvinces:["陸奥"],lat:40.82,lng:140.74,nameMatchesCapital:!0,capitalStory:"城下町・弘前（津軽）と、南部氏の八戸。二大勢力が睨み合う土地で、あえて中立的な新興港町・青森が選ばれた。津軽と南部の気質の違いは、いまも方言と祭りにくっきり残っている。",trivia:"りんご生産量は全国の約6割。三内丸山遺跡は、縄文人が定住し栗林を管理していたことを示す世界遺産。",specialty:"りんご・ホタテ・にんにく"},{id:3,name:"岩手県",kana:"いわて",capital:"盛岡市",capitalKana:"もりおか",region:"東北",oldProvinces:["陸奥"],lat:39.7,lng:141.15,nameMatchesCapital:!1,capitalStory:"県名は県庁のあった岩手郡から。「岩手」は、鬼が二度と来ないと誓って岩に手形を押した三ツ石神社の伝説に由来する。盛岡の古名「不来方（こずかた）」＝鬼が来ない方、も同じ物語の裏表。",trivia:"面積は北海道に次ぐ全国2位で、四国4県の合計の8割ほどにあたる広さ。南部鉄器は、色鮮やかなティーポットとして欧州で人気を集めた。",specialty:"南部鉄器・わんこそば・前沢牛"},{id:4,name:"宮城県",kana:"みやぎ",capital:"仙台市",capitalKana:"せんだい",region:"東北",oldProvinces:["陸奥"],lat:38.27,lng:140.87,nameMatchesCapital:!1,capitalStory:"当初は「仙台県」だったが、1872年に県庁所在地の郡名をとって宮城県へ改称。伊達62万石の城下町が、そのまま東北の中枢都市として引き継がれた。",trivia:"「仙台」は元の地名「千代」に、伊達政宗が唐詩の「仙臺初見五城楼」から字を当てたもの。仙人の台、という壮大な当て字。",specialty:"牡蠣・笹かまぼこ・ササニシキ"},{id:5,name:"秋田県",kana:"あきた",capital:"秋田市",capitalKana:"あきた",region:"東北",oldProvinces:["出羽"],lat:39.72,lng:140.1,nameMatchesCapital:!0,capitalStory:"江戸時代、この街の名は「久保田」だった。佐竹氏の久保田城下が、明治になって県名に合わせて「秋田」と改称した。ふつうは都市名から県名が付くのに、ここは逆転している珍しい例。",trivia:"秋田杉は江戸期から藩の財政を支えた戦略物資。曲げわっぱは、その秋田杉の柾目材を薄く削いで曲げる技から生まれた。",specialty:"秋田杉・きりたんぽ・日本酒"},{id:6,name:"山形県",kana:"やまがた",capital:"山形市",capitalKana:"やまがた",region:"東北",oldProvinces:["出羽"],lat:38.24,lng:140.36,nameMatchesCapital:!0,capitalStory:"最上義光の城下町であり、紅花交易で京都と直結して栄えた商都。染料の紅花は米より高値で取引され、京の紅は山形産だった。",trivia:"さくらんぼ（佐藤錦）は全国生産の7割超。盆地気候の激しい寒暖差が、果物の糖度を押し上げている。",specialty:"さくらんぼ・米沢牛・そば"},{id:7,name:"福島県",kana:"ふくしま",capital:"福島市",capitalKana:"ふくしま",region:"東北",oldProvinces:["磐城","岩代"],lat:37.75,lng:140.47,nameMatchesCapital:!0,capitalStory:"会津・中通り・浜通りという、山脈で隔てられた三つの地域の合併県。県庁は中通り北部の福島に置かれたが、経済規模では郡山、歴史的重みでは会津若松が拮抗し、三すくみの関係が続いている。",trivia:"面積は北海道・岩手に次ぐ全国3位。同じ県内でも会津と浜通りでは冬の景色がまったく違う。",specialty:"桃・会津漆器・日本酒"},{id:8,name:"茨城県",kana:"いばらき",capital:"水戸市",capitalKana:"みと",region:"関東",oldProvinces:["常陸"],lat:36.34,lng:140.45,nameMatchesCapital:!1,capitalStory:"県名は、当時県庁が置かれた地の郡名「茨城郡」から。都市名の水戸ではなく郡名を採った典型例で、徳川御三家・水戸藩の城下町がそのまま県都になった。",trivia:"正しい読みは「いばらき」。納豆・レンコン・干し芋・メロンなど、全国シェア1位の農産物が多い農業大県。",specialty:"納豆・干し芋・メロン"},{id:9,name:"栃木県",kana:"とちぎ",capital:"宇都宮市",capitalKana:"うつのみや",region:"関東",oldProvinces:["下野"],lat:36.57,lng:139.88,nameMatchesCapital:!1,capitalStory:"もともと県庁は栃木町にあった。1884年、県令・三島通庸が宇都宮へ移転。自由民権運動の拠点だった栃木町を嫌ったとも、東北への街道・鉄道の要衝を選んだともいわれる。県名だけが、旧県庁所在地の名を残した。",trivia:"日光東照宮の「見ざる言わざる聞かざる」は、神厩舎に描かれた馬を守る猿の彫刻の一場面にすぎない。",specialty:"いちご・餃子・大谷石"},{id:10,name:"群馬県",kana:"ぐんま",capital:"前橋市",capitalKana:"まえばし",region:"関東",oldProvinces:["上野"],lat:36.39,lng:139.06,nameMatchesCapital:!1,capitalStory:"前橋と高崎による県庁争奪戦は明治期に何度も繰り返され、実際に高崎へ移った時期もある。決め手は生糸で財を成した前橋商人たちの庁舎建設寄付だった。交通の要衝・高崎はいまも実質的な経済の中心。",trivia:"「かかあ天下と空っ風」の「かかあ天下」は、養蚕・製糸で女性が現金収入を稼いだ経済的実力に由来する。",specialty:"生糸・こんにゃく・下仁田ねぎ"},{id:11,name:"埼玉県",kana:"さいたま",capital:"さいたま市",capitalKana:"さいたま",region:"関東",oldProvinces:["武蔵"],lat:35.86,lng:139.65,nameMatchesCapital:!0,capitalStory:"県名の由来は埼玉（さきたま）郡で、当初の県庁予定地は岩槻だった。ところが庁舎に使える建物がなく「仮に」浦和へ置いたところ、そのまま定着してしまった。2001年、浦和・大宮・与野が合併して「さいたま市」に。",trivia:"県名の語源地は行田市の埼玉（さきたま）古墳群。ここ出土の鉄剣の115文字が、古代史の年代を確定させた。",specialty:"深谷ねぎ・草加せんべい・狭山茶"},{id:12,name:"千葉県",kana:"ちば",capital:"千葉市",capitalKana:"ちば",region:"関東",oldProvinces:["上総","下総","安房"],lat:35.61,lng:140.12,nameMatchesCapital:!0,capitalStory:"木更津県と印旛県が合併して誕生した県。両者のほぼ中間にあり、中世に房総を支配した千葉氏ゆかりの地でもある千葉が選ばれた。",trivia:"最高地点は愛宕山408mで、47都道府県中もっとも低い。醤油は野田・銚子が江戸の食文化を支えた。",specialty:"醤油・落花生・海苔"},{id:13,name:"東京都",kana:"とうきょう",capital:"新宿区（東京）",capitalKana:"しんじゅく",region:"関東",oldProvinces:["武蔵"],lat:35.69,lng:139.69,nameMatchesCapital:!0,capitalStory:"実は「遷都の詔」は一度も出されていない。天皇が京都から移り、事実上の首都になっただけ。都庁は1991年に丸の内から新宿へ移った。",trivia:"「日本の首都は東京」と明記した現行法は存在しない（首都建設法は1956年に廃止）。慣習と実態で成り立つ首都。",specialty:"江戸前寿司・出版・金融"},{id:14,name:"神奈川県",kana:"かながわ",capital:"横浜市",capitalKana:"よこはま",region:"関東",oldProvinces:["相模","武蔵"],lat:35.45,lng:139.64,nameMatchesCapital:!1,capitalStory:"条約で開港地と定められたのは東海道の宿場「神奈川」。ところが幕府は、外国人と街道の旅人を接触させまいと、対岸の小さな漁村・横浜に港を開いた。県名だけが条約上の地名を残し、都市は横浜が育った。",trivia:"人口は全国2位。政令指定都市を3つ（横浜・川崎・相模原）抱えるのは全国で唯一。",specialty:"造船・シウマイ・鎌倉彫"},{id:15,name:"新潟県",kana:"にいがた",capital:"新潟市",capitalKana:"にいがた",region:"中部",oldProvinces:["越後","佐渡"],lat:37.9,lng:139.02,nameMatchesCapital:!0,capitalStory:"信濃川河口の日本海側最大の港町。安政五カ国条約で開港五港のひとつに選ばれ、明治初期には人口で全国上位に入る大県だった。",trivia:"日本海側で唯一の政令指定都市。豪雪は水資源でもあり、雪解け水と広い越後平野が米どころを支えている。",specialty:"コシヒカリ・日本酒・洋食器"},{id:16,name:"富山県",kana:"とやま",capital:"富山市",capitalKana:"とやま",region:"中部",oldProvinces:["越中"],lat:36.7,lng:137.21,nameMatchesCapital:!0,capitalStory:"一時は石川県に併合されていた。暴れ川・常願寺川の治水予算が金沢中心の県政で後回しにされ、怒った住民の分県運動が実って1883年に再独立した。「水」が県を作った例。",trivia:"「富山の薬売り」は代金後払いの置き薬。全国に張り巡らせた行商網は、情報網としても機能した。",specialty:"置き薬・ホタルイカ・アルミ"},{id:17,name:"石川県",kana:"いしかわ",capital:"金沢市",capitalKana:"かなざわ",region:"中部",oldProvinces:["加賀","能登"],lat:36.59,lng:136.63,nameMatchesCapital:!1,capitalStory:"加賀百万石の城下町・金沢が県都。県名は、県庁が一時期この地の郡（石川郡）に移された名残で、庁舎が金沢へ戻った後も県名だけ「石川」のまま定着した。",trivia:"金箔の国内生産シェアは99%超。冬の湿った空気が、薄さ1万分の1mmの箔を打つのに適していた。",specialty:"金箔・輪島塗・加賀友禅"},{id:18,name:"福井県",kana:"ふくい",capital:"福井市",capitalKana:"ふくい",region:"中部",oldProvinces:["越前","若狭"],lat:36.07,lng:136.22,nameMatchesCapital:!0,capitalStory:"一度は石川県と滋賀県に分割吸収されて地図から消えた。分県運動の末、1881年に再設置。日本海側の越前と、京へ海の幸を運んだ若狭という性格の違う二国からなる。",trivia:"鯖江の眼鏡フレームは国内生産の9割超。豪雪で農閑期が長い土地に、副業として持ち込まれた産業が世界的地場産業になった。",specialty:"眼鏡フレーム・越前がに・越前和紙"},{id:19,name:"山梨県",kana:"やまなし",capital:"甲府市",capitalKana:"こうふ",region:"中部",oldProvinces:["甲斐"],lat:35.66,lng:138.57,nameMatchesCapital:!1,capitalStory:"「甲府」は甲斐の府中、つまり国の政庁を意味する地名。県名のほうは県庁のある郡名「山梨郡」から採られた。武田信玄は城を築かず、躑躅ヶ崎館という館で領国を治めた。",trivia:"ぶどう・桃ともに生産量日本一。甲州ぶどうは鎌倉時代から栽培されてきた日本の在来品種で、いま欧州のワインコンクールで評価されている。",specialty:"ぶどう・ワイン・水晶細工"},{id:20,name:"長野県",kana:"ながの",capital:"長野市",capitalKana:"ながの",region:"中部",oldProvinces:["信濃"],lat:36.65,lng:138.18,nameMatchesCapital:!0,capitalStory:"善光寺の門前町が県都。県庁を松本へ移す分県運動が明治期に激化し、県会議事堂が焼失する騒ぎにまで発展した。北信と中信の対抗意識は「長野県歌・信濃の国」で辛うじて束ねられている。",trivia:"接する県は8つで全国最多。市町村数77も全国最多で、山ごとに文化圏が分かれた地形の帰結。",specialty:"りんご・信州そば・精密機械"},{id:21,name:"岐阜県",kana:"ぎふ",capital:"岐阜市",capitalKana:"ぎふ",region:"中部",oldProvinces:["美濃","飛騨"],lat:35.39,lng:136.72,nameMatchesCapital:!0,capitalStory:"元の地名は「井ノ口」。天下統一を志した織田信長が、周王朝の興った岐山と孔子の故郷・曲阜から一字ずつ採って「岐阜」と改めたと伝わる。地名そのものが政治的マニフェストだった。",trivia:"白川郷の合掌造りは、屋根裏を養蚕に使うための構造。急勾配は雪を落とすためで、豪雪と副業が形を決めた。",specialty:"刃物（関）・美濃和紙・飛騨牛"},{id:22,name:"静岡県",kana:"しずおか",capital:"静岡市",capitalKana:"しずおか",region:"中部",oldProvinces:["駿河","遠江","伊豆"],lat:34.98,lng:138.38,nameMatchesCapital:!0,capitalStory:"旧称は「駿府」。明治維新で徳川宗家がこの地に移された際、旧称「府中」が「不忠」に通じるのを嫌ったとされ、背後の賤機山（しずはたやま）にちなんで「静岡」と改名された。",trivia:"茶の産地になったのは、職を失った幕臣が牧之原台地を開墾したから。武士の失業対策が日本一の茶どころを生んだ。",specialty:"茶・楽器・プラモデル"},{id:23,name:"愛知県",kana:"あいち",capital:"名古屋市",capitalKana:"なごや",region:"中部",oldProvinces:["尾張","三河"],lat:35.18,lng:136.91,nameMatchesCapital:!1,capitalStory:"県名は名古屋のある郡名「愛知郡」から。語源は万葉集に詠まれた「年魚市潟（あゆちがた）」。派手好みの尾張と、堅実な三河という気質の異なる二国が一つの県になった。",trivia:"製造品出荷額は40年以上連続で全国1位。トヨタの前身は豊田自動織機で、繊維機械の技術が自動車に転用された。",specialty:"自動車・味噌・瀬戸焼"},{id:24,name:"三重県",kana:"みえ",capital:"津市",capitalKana:"つ",region:"近畿",oldProvinces:["伊勢","伊賀","志摩","紀伊"],lat:34.73,lng:136.51,nameMatchesCapital:!1,capitalStory:"最初の県庁は四日市に置かれた。その所在地の郡名「三重郡」がそのまま県名になったが、1873年に県庁は津へ移転。県名だけが四日市時代の記念として残った。県名と県都のズレの、もっとも分かりやすい実例。",trivia:'「津」は日本一短い市名。ローマ字の "Tsu"、英語表記 "Z" と並び、短い地名としてしばしば話題になる。',specialty:"真珠・伊勢海老・松阪牛"},{id:25,name:"滋賀県",kana:"しが",capital:"大津市",capitalKana:"おおつ",region:"近畿",oldProvinces:["近江"],lat:35,lng:135.87,nameMatchesCapital:!1,capitalStory:"県名は大津のある郡名「滋賀郡」から。大津は琵琶湖の水運と東海道・中山道が交わる結節点で、天智天皇の大津宮以来の要地でもある。",trivia:"琵琶湖は県面積の約6分の1。近江商人の「三方よし（売り手・買い手・世間）」は、現代のCSRの原型としてしばしば引かれる。",specialty:"近江牛・信楽焼・鮒ずし"},{id:26,name:"京都府",kana:"きょうと",capital:"京都市",capitalKana:"きょうと",region:"近畿",oldProvinces:["山城","丹波","丹後"],lat:35.02,lng:135.76,nameMatchesCapital:!0,capitalStory:"1000年余の都。天皇の東京移居で人口が3分の2まで落ち込み、危機感から日本初の学区制小学校を市民の出資で創設し、琵琶湖疏水を掘って水力発電と路面電車を実現した。",trivia:"「府」を名乗るのは東京・大阪・京都のみ（東京はのちに都へ）。重要都市を国が直轄した明治初期の区分の名残。",specialty:"西陣織・清水焼・宇治茶"},{id:27,name:"大阪府",kana:"おおさか",capital:"大阪市",capitalKana:"おおさか",region:"近畿",oldProvinces:["摂津","河内","和泉"],lat:34.69,lng:135.5,nameMatchesCapital:!0,capitalStory:"江戸期は「大坂」「大阪」の両表記が混在し、明治政府が「大阪」を公式に採用した。「坂」が「士（さむらい）が反る」と読めて縁起が悪かったから、という説もよく語られる。",trivia:"面積は香川に次いで全国2番目に小さい。全国の年貢米が集まった「天下の台所」で、堂島の米市場は世界初の先物取引所とされる。",specialty:"粉もん・医薬品・金属加工"},{id:28,name:"兵庫県",kana:"ひょうご",capital:"神戸市",capitalKana:"こうべ",region:"近畿",oldProvinces:["摂津","播磨","但馬","丹波","淡路"],lat:34.69,lng:135.2,nameMatchesCapital:!1,capitalStory:"開港地として条約に書かれたのは古来の良港「兵庫津」。だが実際の外国人居留地は東隣の神戸村に置かれ、そこが港町として発展した。県名は兵庫、県都は神戸というねじれは、神奈川／横浜と同じ構図。",trivia:"日本海と瀬戸内海の両方に面する数少ない県。旧五国からなり「日本の縮図」と呼ばれる。標準時子午線・東経135度が明石を通る。",specialty:"日本酒（灘）・神戸牛・そろばん"},{id:29,name:"奈良県",kana:"なら",capital:"奈良市",capitalKana:"なら",region:"近畿",oldProvinces:["大和"],lat:34.69,lng:135.83,nameMatchesCapital:!0,capitalStory:"一度は堺県、次いで大阪府に併合されて姿を消した。大阪主導の県政に不満を抱いた住民の再設置運動が実り、1887年に復活。翌1888年の香川県再置をもって、いまの47のかたちが確定した。",trivia:"「なら」の語源は平らな土地を意味する「均す（ならす）」という説が有力。海に面しない内陸県。",specialty:"奈良墨・吉野杉・柿"},{id:30,name:"和歌山県",kana:"わかやま",capital:"和歌山市",capitalKana:"わかやま",region:"近畿",oldProvinces:["紀伊"],lat:34.23,lng:135.17,nameMatchesCapital:!0,capitalStory:"徳川御三家・紀州藩の城下町。地名は、豊臣秀吉が築城の際に景勝地「和歌の浦」から採ったと伝わる。八代将軍・吉宗はこの藩の出身。",trivia:"みかん・梅（南高梅）・柿がいずれも生産量日本一。熊野古道は、スペインの巡礼路と並ぶ世界遺産の「道」。",specialty:"みかん・南高梅・備長炭"},{id:31,name:"鳥取県",kana:"とっとり",capital:"鳥取市",capitalKana:"とっとり",region:"中国",oldProvinces:["因幡","伯耆"],lat:35.5,lng:134.24,nameMatchesCapital:!0,capitalStory:"一時は島根県に併合されたが、松江中心の県政への不満から分県運動が起こり1881年に再独立。地名の由来は、湿地で水鳥を捕らえた「鳥取部（ととりべ）」という古代の職業集団。",trivia:"人口約54万人で全国最少。鳥取砂丘は砂漠ではなく、中国山地の花崗岩が川で運ばれ海流で打ち上げられた堆積地形。",specialty:"二十世紀梨・松葉がに・らっきょう"},{id:32,name:"島根県",kana:"しまね",capital:"松江市",capitalKana:"まつえ",region:"中国",oldProvinces:["出雲","石見","隠岐"],lat:35.47,lng:133.05,nameMatchesCapital:!1,capitalStory:"県名は松江のある郡名「島根郡」（島根半島）から。出雲大社のある出雲ではなく、堀尾氏が築いた水の城下町・松江が県都に選ばれた。",trivia:"全国が神無月の10月、出雲だけは神々が集う「神在月」。17世紀初頭、日本の銀産出は世界の約3分の1を占めたとされ、その多くが石見産だった。",specialty:"出雲そば・宍道湖のしじみ・石州瓦"},{id:33,name:"岡山県",kana:"おかやま",capital:"岡山市",capitalKana:"おかやま",region:"中国",oldProvinces:["備前","備中","美作"],lat:34.66,lng:133.93,nameMatchesCapital:!0,capitalStory:"宇喜多秀家が「岡山」という小丘に築城し、城下を整備したのが始まり。山陽道と瀬戸内航路が交わる交通の要衝で、いまも新幹線と四国連絡の結節点。",trivia:"降水量1mm未満の日が多く「晴れの国」。児島は国産ジーンズ発祥の地で、学生服づくりの縫製技術が転用された。",specialty:"白桃・マスカット・ジーンズ"},{id:34,name:"広島県",kana:"ひろしま",capital:"広島市",capitalKana:"ひろしま",region:"中国",oldProvinces:["安芸","備後"],lat:34.4,lng:132.46,nameMatchesCapital:!0,capitalStory:"毛利輝元が太田川デルタの「広い島」に築城したのが地名の由来。日清戦争のときは大本営と帝国議会が一時この地に置かれ、事実上の臨時首都として機能した。",trivia:"牡蠣の生産量は全国の約6割。穏やかな内海と河川からの栄養が、養殖に理想的な環境をつくっている。",specialty:"牡蠣・レモン・熊野筆"},{id:35,name:"山口県",kana:"やまぐち",capital:"山口市",capitalKana:"やまぐち",region:"中国",oldProvinces:["周防","長門"],lat:34.19,lng:131.47,nameMatchesCapital:!0,capitalStory:"長州藩の藩庁は萩にあったが、幕末に内陸の山口へ移された（山口移鎮）。倒幕の司令塔となったこの新拠点が、そのまま県庁所在地になった。",trivia:"県庁所在地の人口は鳥取市に次いで少なく、下関・周南が経済規模で拮抗する。室町期の大内氏は「西の京」と呼ばれる文化都市を築いた。",specialty:"ふぐ・萩焼・夏みかん"},{id:36,name:"徳島県",kana:"とくしま",capital:"徳島市",capitalKana:"とくしま",region:"四国",oldProvinces:["阿波"],lat:34.07,lng:134.56,nameMatchesCapital:!0,capitalStory:"蜂須賀家の城下町。吉野川がもたらす肥沃な土壌で藍（阿波藍）を独占的に生産し、その富が藩を支えた。ジャパンブルーの原料はここから全国へ運ばれた。",trivia:"阿波踊りは400年以上の歴史。青色LEDを事業化した企業が本社を置き、藍の国が光の青でも世界を取った。",specialty:"阿波藍・すだち・鳴門わかめ"},{id:37,name:"香川県",kana:"かがわ",capital:"高松市",capitalKana:"たかまつ",region:"四国",oldProvinces:["讃岐"],lat:34.34,lng:134.04,nameMatchesCapital:!1,capitalStory:"県名は高松のある郡名「香川郡」から。一時は愛媛県に併合されていたが、1888年に再独立。これが47都道府県のかたちが確定した最後の出来事だった。",trivia:"面積は全国最小。雨が少ない讃岐平野ではため池密度が日本一で、小麦と塩とイリコが揃ったことがうどん文化を生んだ。",specialty:"讃岐うどん・オリーブ・希少糖"},{id:38,name:"愛媛県",kana:"えひめ",capital:"松山市",capitalKana:"まつやま",region:"四国",oldProvinces:["伊予"],lat:33.84,lng:132.77,nameMatchesCapital:!1,capitalStory:"県名は『古事記』で伊予国を指す「愛比売（えひめ）」から。神話の神名に由来する県名は47のうちここだけ。県庁は加藤嘉明の城下町・松山に置かれた。",trivia:"道後温泉は日本最古級の温泉。正岡子規と夏目漱石の交友がこの街で育ち、『坊っちゃん』の舞台になった。",specialty:"みかん・今治タオル・真珠"},{id:39,name:"高知県",kana:"こうち",capital:"高知市",capitalKana:"こうち",region:"四国",oldProvinces:["土佐"],lat:33.56,lng:133.53,nameMatchesCapital:!0,capitalStory:"山内一豊が大高坂山に築城し、河に挟まれた地形から「河中（こうち）」と呼ばれたのが、のちに「高知」の字に。土佐藩の郷士層から坂本龍馬らが出た。",trivia:"森林率84%で日本一。急峻な山と黒潮が、カツオの一本釣りと林業という両極の産業を育てた。",specialty:"カツオ・ゆず・土佐和紙"},{id:40,name:"福岡県",kana:"ふくおか",capital:"福岡市",capitalKana:"ふくおか",region:"九州",oldProvinces:["筑前","筑後","豊前"],lat:33.61,lng:130.42,nameMatchesCapital:!0,capitalStory:"那珂川を挟んで、武士の城下町「福岡」と商人の町「博多」が並立していた。市名を決める市議会の投票が同数となり、議長裁決で「福岡市」に決着。代わりに駅名と港名に「博多」が残った。",trivia:"九州最大の都市で、空港から中心街まで地下鉄5分という国内屈指のアクセス。古代から大陸への玄関口だった。",specialty:"明太子・久留米絣・八女茶"},{id:41,name:"佐賀県",kana:"さが",capital:"佐賀市",capitalKana:"さが",region:"九州",oldProvinces:["肥前"],lat:33.25,lng:130.3,nameMatchesCapital:!0,capitalStory:"一時は長崎県と三潴県に分割吸収されて消滅し、1883年に復活した県。幕末の佐賀藩は独自に反射炉を築いて洋式砲の国産化に挑み、その技術力で維新を支えた。",trivia:"有田焼は日本初の磁器。オランダ東インド会社を通じて欧州の王侯貴族に輸出され、「イマリ」の名で知られた。",specialty:"有田焼・佐賀牛・海苔"},{id:42,name:"長崎県",kana:"ながさき",capital:"長崎市",capitalKana:"ながさき",region:"九州",oldProvinces:["肥前","壱岐","対馬"],lat:32.74,lng:129.87,nameMatchesCapital:!0,capitalStory:"鎖国下で唯一、西欧に開かれた窓口・出島を擁した港町。西洋の医学・砲術・語学はここから入り、幕末の人材はこぞって長崎へ遊学した。",trivia:"島の数は1479で日本一。海岸線の長さも北海道に次ぐ2位で、平地が少ないため坂と斜面市街地が名物になった。",specialty:"ちゃんぽん・カステラ・波佐見焼"},{id:43,name:"熊本県",kana:"くまもと",capital:"熊本市",capitalKana:"くまもと",region:"九州",oldProvinces:["肥後"],lat:32.79,lng:130.74,nameMatchesCapital:!0,capitalStory:"元の表記は「隈本」。加藤清正が築城の際、「隈」の字が武将にふさわしくないとして「熊」に改めたと伝わる。清正の治水事業はいまも現役の水利施設として機能している。",trivia:"水道水を100%地下水でまかなう唯一の政令指定都市。阿蘇のカルデラに降った雨が伏流水として市街地へ届く。",specialty:"いぐさ（畳表）・馬刺し・トマト"},{id:44,name:"大分県",kana:"おおいた",capital:"大分市",capitalKana:"おおいた",region:"九州",oldProvinces:["豊前","豊後"],lat:33.24,lng:131.61,nameMatchesCapital:!0,capitalStory:"『豊後国風土記』の「碩田（おおきた）」＝大きく広い田、が語源とされる。戦国期にはキリシタン大名・大友宗麟の府内が、南蛮貿易で国際都市として賑わった。",trivia:"源泉数・湧出量ともに日本一。別府と湯布院という性格の異なる二大温泉地を抱える。",specialty:"温泉・かぼす・関さば"},{id:45,name:"宮崎県",kana:"みやざき",capital:"宮崎市",capitalKana:"みやざき",region:"九州",oldProvinces:["日向"],lat:31.91,lng:131.42,nameMatchesCapital:!0,capitalStory:"一時は鹿児島県に併合されたが、県政が薩摩中心に偏ることへの不満から分県運動が起こり、1883年に再設置された。地名の由来は「神宮の前（宮の崎）」など諸説あり、はっきりしていない。",trivia:"記紀神話の神武東征の出発地。温暖な気候から昭和期は新婚旅行のメッカで、そのブームがプロ野球キャンプ地の定着にもつながった。",specialty:"マンゴー・地鶏・完熟きんかん"},{id:46,name:"鹿児島県",kana:"かごしま",capital:"鹿児島市",capitalKana:"かごしま",region:"九州",oldProvinces:["薩摩","大隅"],lat:31.56,lng:130.56,nameMatchesCapital:!0,capitalStory:"島津氏700年の城下町・鶴丸城の城下。島津斉彬の集成館事業は、反射炉・造船・紡績を一体で興した日本最初期の近代工業コンビナートだった。",trivia:"いまも噴煙を上げる桜島は、1914年の噴火で大隅半島と陸続きになった。火山灰土壌がサツマイモと畜産に向いた。",specialty:"黒豚・焼酎・さつまいも"},{id:47,name:"沖縄県",kana:"おきなわ",capital:"那覇市",capitalKana:"なは",region:"沖縄",oldProvinces:["琉球"],lat:26.21,lng:127.68,nameMatchesCapital:!1,capitalStory:"琉球王国の王都は首里だった。しかし1879年の琉球処分で県が置かれた際、明治政府は王権の象徴である首里を避け、貿易港として実権を握っていた那覇に県庁を据えた。",trivia:"1972年まで米国施政下にあり、通貨はドル、車は右側通行だった。いまも国内の米軍専用施設面積の約7割が集中する。",specialty:"泡盛・紅型・サトウキビ"}],wL=e=>f7.find(t=>t.id===e),R0="0 0 96.23 100",R7={x:1,y:2,w:27.98,h:17},O0="M89.93 11.51L90.18 11.33L90.38 11.00L91.76 9.99L91.77 9.64L92.52 8.67L93.10 8.14L93.18 7.75L93.83 6.89L94.07 6.84L94.49 7.31L94.93 7.50L95.80 7.46L96.23 7.25L96.00 7.76L95.77 7.94L95.47 7.79L95.18 7.95L95.11 8.18L94.75 8.46L93.76 8.55L93.51 8.75L93.39 9.10L92.74 9.41L92.41 9.98L92.49 10.20L92.30 10.12L92.15 10.23L91.97 10.80L91.29 10.96L90.96 11.23L90.71 12.67L90.72 12.17L90.12 12.26L89.93 11.51ZM93.47 13.58L93.85 13.41L94.26 13.51L94.11 13.71L94.18 13.81L93.77 14.02L93.71 13.80L93.47 13.58ZM93.28 14.36L93.38 14.21L93.59 14.23L93.67 14.08L93.73 14.16L93.57 14.33L93.28 14.36ZM92.40 14.04L92.84 14.03L92.79 14.14L .x+7.6,y:i.y-6,fontSize:"3.4",fill:"var(--c-gold)",dominantBaseline:"middle",className:"font-display",letterSpacing:"0.2",children:l.name})]})]})}const xL=[{prefectureId:24,prompt:"三重県の県庁所在地は津市。では、なぜ県名は「津県」ではなく「三重県」なのか？",choices:["最初の県庁が四日市にあり、その郡名「三重郡」が県名になったから","伊勢・伊賀・志摩の三国が重なるから","三重塔のある寺が多かったから","津という字が短すぎて紛らわしかったから"],answerIndex:0,insight:"1872年、県庁は四日市に置かれ、その地の郡名から「三重県」と名づけられた。翌年に県庁は津へ移ったが、県名だけが四日市時代のまま残った。県名は「郡の名」、県庁所在地は「町の名」——このズレこそ、県名と県都が食い違う県のほとんどに共通する種明かしになっている。"},{prefectureId:9,prompt:"栃木県の県庁所在地が、栃木市ではなく宇都宮市になったのはなぜ？",choices:["栃木町が大火で焼失したから","1884年に県令・三島通庸が県庁を宇都宮へ移したから","住民投票で決まったから","宇都宮のほうが古い城下町だったから"],answerIndex:1,insight:"当初の県庁は栃木町にあった。移転を強行したのは「土木県令」と呼ばれた三島通庸。栃木町が自由民権運動の拠点だったことを嫌ったとも、東北へ延びる街道・鉄道の要衝を重視したともいわれる。政治的判断が地図に刻まれた一例で、県名だけが旧県庁の名を今に伝えている。"},{prefectureId:14,prompt:"神奈川県の県庁が横浜にあるのに、県名が「神奈川」なのはなぜ？",choices:["横浜が当時まだ村だったので県名にできなかったから","条約上の開港地は東海道の宿場「神奈川」だったから","神奈川県令の名字が神奈川だったから","横浜という地名が明治以降にできたから"],answerIndex:1,insight:"日米修好通商条約が開港地と定めたのは「神奈川」。しかし幕府は、外国人と東海道の旅人が接触するのを避けたいという思惑から、対岸の寒村・横浜に港を開いた。列強は当初これを条約違反だと抗議している。結果、条約の地名が県名に、実際に育った港町が県都になった。"},{prefectureId:11,prompt:"埼玉県の県庁が浦和（現・さいたま市）に置かれたのは、どんな経緯から？",choices:["中山道の宿場で最大の町だったから","当初の予定地・岩槻に使える庁舎がなく、仮に浦和へ置いたら定着したから","東京に最も近かったから","埼玉郡の中心だったから"],answerIndex:1,insight:"県名の由来である埼玉（さきたま）郡の岩槻が県庁予定地だった。ところが庁舎に転用できる建物がなく、暫定的に浦和へ。その「仮」がそのまま本決まりになった。行政の中心が偶然で決まることは珍しくない。県名の語源地・行田市の埼玉古墳群には、いまも静かな古墳群が残っている。"},{prefectureId:10,prompt:"群馬県で、交通の要衝である高崎ではなく前橋が県庁所在地になった決め手は？",choices:["前橋城が現存していたから","生糸で富を築いた前橋商人が庁舎建設費を寄付したから","高崎が水害の常襲地だったから","国が鉄道用地を優先したから"],answerIndex:1,insight:"前橋と高崎の県庁争奪戦は明治期に繰り返され、一時は実際に高崎へ移っている。最終的な決め手は、生糸産業で財を成した前橋商人たちによる庁舎建設資金の拠出だった。経済力が行政を引き寄せた形で、いまも高崎は交通と商業、前橋は行政という役割分担が残る。"},{prefectureId:4,prompt:"「県名と県庁所在地名が異なる県は、戊辰戦争で新政府に抵抗した側だ」という俗説がある。この説の評価として正しいのは？",choices:["明治政府の公式文書で確認された事実","例外が多く、俗説として扱われている","大正期に法律で定められた","完全に一致しており異説はない"],answerIndex:1,insight:"明治のジャーナリスト宮武外骨が唱えた有名な説で、仙台・盛岡・水戸などが確かに当てはまる。だが官軍側の金沢（石川県）や名古屋（愛知県）も不一致で、逆に賊軍側の会津を含む福島県は一致する。実際の分かれ目は「郡名を採ったか、町名を採ったか」という命名手続きの違い。よくできた物語ほど、例外の確認が要る。"},{prefectureId:47,prompt:"沖縄県の県庁が、琉球王国の王都・首里ではなく那覇に置かれたのはなぜ？",choices:["首里城が焼失していたから","王権の象徴を避け、貿易港として実権を持つ那覇を選んだから","首里に平地がなかったから","住民の多数が那覇に住んでいたから"],answerIndex:1,insight:"1879年の琉球処分で県が置かれたとき、明治政府は王府の象徴である首里ではなく、交易と経済の実権を握っていた那覇を行政拠点に選んだ。旧王権の中心を外すという判断は、統治のセオリーでもある。首里と那覇は1954年に合併し、いまはひとつの市になっている。"},{prefectureId:38,prompt:"47都道府県の中で唯一、記紀神話に登場する神の名に由来する県名はどれ？",choices:["愛媛県","出雲を擁する島根県","奈良県","宮崎県"],answerIndex:0,insight:"『古事記』の国生み神話で、伊予国は「愛比売（えひめ）」という女神の名で呼ばれる。これをそのまま県名にしたのが愛媛県で、神名由来は47のうちここだけ。ほかの県名はおおむね郡名か都市名から採られている。県庁は松山、道後温泉と『坊っちゃん』の街。"},{prefectureId:29,prompt:"現在の47都道府県のうち、もっとも遅く「復活」してかたちが確定したのはどの県？",choices:["沖縄県","奈良県","香川県","富山県"],answerIndex:2,insight:"奈良県の再設置は1887年、香川県が愛媛県から再独立したのは1888年。この香川の分県で、現在の47のかたちが確定した。明治初期の県は3府302県から始まり、統合と分割を繰り返して落ち着くまで約20年かかっている。いまの地図は「決まりきったもの」ではなく、交渉の結果として残った形。"},{prefectureId:16,prompt:"富山県が石川県から分離独立した、直接のきっかけは？",choices:["方言が通じなかったから","常願寺川の治水予算が後回しにされたから","藩の借金の分配で揉めたから","鉄道路線の敷設ルート争い"],answerIndex:1,insight:"越中は暴れ川・常願寺川をはじめ水害の常襲地だった。金沢中心の県政では治水予算が回らず、住民の分県運動が起きて1883年に再独立。同じ構図は、鳥取が島根から、宮崎が鹿児島から分かれた経緯にも見られる。「予算がどこへ向くか」は、県境を引き直すほどの力を持つ。"},{prefectureId:40,prompt:"福岡市の市名が「博多市」ではなく「福岡市」に決まった経緯は？",choices:["黒田家が資金を出したから","市議会の投票が同数となり、議長裁決で決まったから","博多という地名が新しかったから","県名に合わせるよう国が指示したから"],answerIndex:1,insight:"那珂川を挟んで武士の城下町「福岡」と商人町「博多」が並立していた。1890年の市議会は同数で割れ、議長裁決で福岡に決着したと伝わる。その代償のように、駅名・港名・祭りの名には「博多」が残った。ひとつの都市に二つの名が今も併存している。"},{prefectureId:17,prompt:"石川県の県庁は金沢市。県名が「金沢県」ではない理由として有力なのは？",choices:["県庁が一時、石川郡に移された名残","金沢の名が加賀藩を連想させたから","石川五右衛門にちなんだから","手取川の別名が石川だったから"],answerIndex:0,insight:"金沢県は1872年に石川県へ改称された。県庁が石川郡内へ移された時期があり、その郡名が県名として残ったとされる。庁舎は金沢へ戻ったが、名前は戻らなかった。ここでも「郡名か、町名か」という命名の分岐が、県名と県都のズレを生んでいる。"},{prefectureId:20,prompt:"長野県で明治期に激化した「分県運動」とは、何をめぐる争いだった？",choices:["善光寺の管理権","県庁を長野から松本へ移すかどうか","県境をどこに引くか","県歌をどれにするか"],answerIndex:1,insight:"北信の長野と中信の松本の対立は激烈で、県会議事堂が焼失する騒ぎにまで発展した。分県案は国会に持ち込まれたこともある。8県と接し、市町村数77で全国最多という数字が示すとおり、山ごとに独立した文化圏を抱えた県ならではの緊張だった。"},{prefectureId:22,prompt:"静岡市が旧称の「駿府」から「静岡」に改められた理由は？",choices:["旧称「府中」が「不忠」に通じるのを嫌ったから","駿河国が消滅したから","静岡藩主の姓が静岡だったから","同名の町が他県にあったから"],answerIndex:0,insight:"維新後、徳川宗家がこの地に移された際、旧称「府中」が「不忠」に通じるとして改称が図られた、と伝わる。候補から選ばれたのが、背後の賤機山（しずはたやま）にちなむ「静岡」。ちなみに日本一の茶どころになったのも、職を失った幕臣が牧之原台地を開墾したから。武士の失業対策が、産業地図を書き換えた。"},{prefectureId:5,prompt:"秋田市について、他県とは逆の珍しい経緯とは？",choices:["県名に合わせて都市名のほうが改称された","県庁が三度移転した","市名を公募で決めた","県より先に市が誕生した"],answerIndex:0,insight:"江戸時代、この街は佐竹氏の「久保田」だった。明治になって県名の「秋田」に合わせ、都市名のほうが改称されている。通常は都市名から県名が付くので、順序が逆。地名は動かない土地の記録に見えて、実は行政の都合でしばしば書き換えられてきた。"},{prefectureId:1,prompt:"北海道の道庁が、当時栄えていた函館ではなく札幌に置かれたのはなぜ？",choices:["函館が開港場で外国人が多かったから","開拓使が内陸に新首都を計画的に建設したから","札幌に既に大きな町があったから","気候が温暖だったから"],answerIndex:1,insight:"札幌はゼロから設計された計画都市で、手本は京都の条坊制。碁盤の目の街並みと「北○条西○丁目」という住所表記は、その設計思想がそのまま残ったもの。既存の港町を選ばず内陸に拠点を置いたのは、開拓を面として進めるための戦略的判断だった。"},{prefectureId:28,prompt:"兵庫県の県庁が神戸市にあるのに、県名が「兵庫」なのはなぜ？",choices:["兵庫県令が兵庫津の出身だったから","条約上の開港地が古来の港「兵庫津」だったから","神戸が明治以降にできた地名だから","兵庫の人口のほうが多かったから"],answerIndex:1,insight:"開港が定められたのは古来の良港・兵庫津。だが外国人居留地は東隣の神戸村に置かれ、そこが近代港湾都市として発展した。神奈川／横浜とまったく同じ構図が、東西の二大開港地で起きている。「条約の地名」と「実際に育った町」がずれる——開港場に共通するパターン。"},{prefectureId:32,prompt:"島根県の県庁が、出雲大社のある出雲ではなく松江に置かれた背景は？",choices:["出雲大社が行政を拒んだから","堀尾氏が築いた城下町・松江が地域の政治拠点だったから","出雲が石見国だったから","松江が港町だったから"],answerIndex:1,insight:"宗教的な中心と行政の中心は必ずしも一致しない。松江は堀尾吉晴が宍道湖畔に築いた城下町で、江戸期を通じて政治の拠点だった。県名は松江のある「島根郡」から。ちなみに全国が神無月の10月、出雲だけは神々が集まる「神在月」と呼ばれる。"},{prefectureId:35,prompt:"山口県の県庁が、長州藩の本拠だった萩ではなく山口市にあるのはなぜ？",choices:["萩が日本海側で不便だったため幕末に藩庁が山口へ移された","萩城が焼失したから","山口が幕府直轄地だったから","毛利家が山口出身だったから"],answerIndex:0,insight:"幕末、長州藩は防衛と機動性を考えて藩庁を内陸の山口へ移した（山口移鎮）。倒幕の司令塔となったこの新拠点が、そのまま県庁所在地に引き継がれた。県庁所在地の人口は鳥取市に次いで少なく、経済規模では下関・周南が拮抗している。"},{prefectureId:13,prompt:"「東京が日本の首都である」ことについて、法制度上の実態は？",choices:["憲法に明記されている","首都を明記した現行法はなく、慣習と実態による","1868年の遷都の詔で確定した","首都圏整備法に明記されている"],answerIndex:1,insight:"「遷都の詔」は出されていない。天皇が京都から移り、事実上の首都になっただけ。首都を明記していた首都建設法は1956年に廃止され、以後「首都は東京」と定める現行法はない。京都側が「東京は行幸中」という立場を長く保ったのも、この経緯があるから。"}];function $6(e){const t=[...e];for(let
